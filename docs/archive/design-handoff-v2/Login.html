<!DOCTYPE html>
<html lang="ko" data-color="green">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로그인 — Concord Private Tutoring</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="site/concord.css" />
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <a class="logo" href="Concord - 페이지 디자인.html">Concord<span>.</span></a>
    <nav class="nav-links">
      <a href="Pricing.html">요금제</a>
      <a href="Tutors.html">강사진</a>
      <a href="Reviews.html">후기</a>
      <a href="FAQ.html">FAQ</a>
    </nav>
    <div class="nav-right">
      <div class="seg" role="group" aria-label="색 테마 선택">
        <button class="g" data-set-color="green" aria-label="그린 테마"><span class="dot"></span></button>
        <button class="b" data-set-color="blue" aria-label="블루 테마"><span class="dot"></span></button>
      </div>
      <button class="theme-toggle" data-toggle-theme aria-label="다크 모드 전환" title="다크/라이트 전환">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <a class="btn btn-acc btn-sm" href="#">무료 상담</a>
    </div>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-bg"></div>
    <div class="auth-card reveal">
      <div class="brand">Concord<span>.</span></div>
      <h1>다시 오신 것을 환영해요</h1>
      <p class="sub">학습 플래너와 상담 내역을 확인하세요.</p>

      <div class="seg-tabs" data-group aria-label="로그인 역할">
        <button class="on" data-val="student">학생</button>
        <button data-val="teacher">선생님</button>
      </div>

      <div class="field">
        <label for="id">전화번호 또는 이메일</label>
        <input id="id" type="text" placeholder="010-0000-0000" autocomplete="username" />
      </div>
      <div class="field">
        <label for="pw">비밀번호</label>
        <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <a class="btn btn-acc btn-block btn-lg" href="#">로그인</a>

      <div class="auth-alt">
        아직 회원이 아니신가요? <a href="#">무료 상담으로 시작하기</a>
      </div>
    </div>
  </div>
</main>

<script src="site/concord.js"></script>
</body>
</html>
